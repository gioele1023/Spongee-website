<!-- NAVIGATION -->

        <div class="container">

            <div class="row align-items-center">

                    <h1>
                        Unsere Garagenschwämme

                </div>
            </div>

        </div>

    </section>

        <div class="container">

        
            <div class="row">


                <!-- Haushalt -->

                    <div class="card produkt1-card h-100">

                        <img src="images/felgenschwamm.jpg"
                             class="produkt-hintergrund"

                        <div class="card-body produkt1-inhalt">

                                Felgenschwamm

                 <!-- PRODUKT 2 -->
        <div class="col-md-4 mb-4">

        <div class="card-body produkt2-inhalt">

            <h3 class="card-title">
                Autoschwamm

            <p class="card-text">

</div>

<!-- PRODUKT 3 -->
<div class="col-md-4 mb-4">

    <div class="card produkt3-card h-100">

        <img src="images/garageschwämme.jpg"
